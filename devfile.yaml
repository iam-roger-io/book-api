schemaVersion: 2.3.0
metadata:
  name: sb-book-api
  displayName: Spring Boot®
  description: Java application using Spring Boot® and OpenJDK 21
  icon: https://raw.githubusercontent.com/devfile-samples/devfile-stack-icons/main/spring.svg
  tags:
    - Java
    - Spring
  projectType: springboot
  language: Java
  version: 1.4.0
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:bb5baa05f316944ca6df56ad718c368b248e8f4b2488551549b1b13c4ed5844b
      endpoints:
        - name: https-springbt
          targetPort: 8080
          protocol: http      
commands:
  - id: setup-java-21
    exec:
      component: tools
      commandLine: |
        export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
        export PATH=/usr/lib/jvm/java-21-openjdk/bin:$PATH
        echo "JAVA_HOME=$JAVA_HOME" >> ~/.bashrc
        echo "PATH=/usr/lib/jvm/java-21-openjdk/bin:\$PATH" >> ~/.bashrc
        java -version
      group:
        kind: build
        isDefault: true

events:
  postStart:
    - setup-java-21
